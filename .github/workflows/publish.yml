name: Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory to publish
        required: true
        type: choice
        options:
          - di
          - eventbus

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    env:
      NODE_OPTIONS: --unhandled-rejections=strict
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: npm install --global npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # See ci.yml: @tiberjs/durable is excluded until it is migrated to the current runner.
      - run: pnpm -r --filter '!@tiberjs/durable' build
      - run: pnpm exec vitest run --project @tiberjs/di --project @tiberjs/eventbus
      - run: npm publish --access public --provenance
        working-directory: packages/${{ inputs.package }}
