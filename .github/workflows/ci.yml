name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --unhandled-rejections=strict
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # @tiberjs/durable still targets the 0.1.x runner API and is excluded until it is
      # migrated (AGENTS.md, "@tiberjs/durable"). Drop the filters with that migration.
      - run: pnpm -r --filter '!@tiberjs/durable' build
      - run: pnpm exec vitest run --project @tiberjs/di --project @tiberjs/eventbus
      - run: pnpm -r --filter '!@tiberjs/durable' pack --pack-destination .artifacts
